# Production-shaped stack for the Shipment Exception Agent.
#
#   docker compose up --build
#
# opens the console at http://localhost:8000 — fully wired, no host
# state: decisions and graph checkpoints live in PostgreSQL (db),
# policy vectors in pgvector in the same database, shipment
# documents in object storage (minio). The api service is stateless;
# scale it by adding replicas against the same db/minio.
#
# The default model backend is the offline mock. For a real model,
# set MODEL_BACKEND + the provider key in your shell (or a local
# .env — never committed):
#   MODEL_BACKEND=openai OPENAI_API_KEY=... docker compose up --build
# For a fully local model, layer the dev override, which re-points
# the api at a local Ollama server (see docker-compose.local.yml):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     --profile local-llm up --build
#
# Credentials below are local-stack defaults for this reference
# stack, overridable via the environment. A real deployment injects
# them from a secrets manager and puts TLS in front of every hop —
# see "What a production deploy still needs" in docs/architecture.md.
#
# NOT YET VERIFIED: this stack has not been built in CI (the repo has
# no Docker build gate); the first `docker compose up --build` on a
# developer machine is its first full exercise. The Python suite —
# including the Postgres/pgvector integration tests — is verified.

services:
  api:
    build:
      context: .
      args:
        # Provider SDKs (openai/anthropic) in the image; the mock
        # backend needs none of them, a real one does.
        UV_EXTRA_ARGS: "--extra llm"
    ports:
      - "8000:8000"
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-mock}
      DATABASE_URL: postgresql://logistics:logistics@db:5432/logistics
      S3_ENDPOINT_URL: http://minio:8333
      S3_BUCKET: shipment-documents
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    # PostgreSQL 16 + pgvector: records, checkpoints, vectors.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistics}
      POSTGRES_DB: logistics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object storage for shipment documents. MinIO Inc.
  # locked public pulls of minio/minio and minio/mc (both used below)
  # behind a login/license in 2025, so this runs SeaweedFS's S3 gateway
  # instead — same path-style PUT/GET/HEAD API this app's S3 client
  # needs. Service name stays `minio` so S3_ENDPOINT_URL above doesn't
  # need to change; only the port (9000 -> 8333) does.
  minio:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip=0.0.0.0
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    # One-shot: create the documents bucket, then exit. SeaweedFS's S3
    # gateway doesn't enforce SigV4 auth in this unconfigured mode, so
    # a plain unsigned PUT is enough (no mc / MinIO CLI needed).
    image: curlimages/curl:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c", "code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://minio:8333/shipment-documents); case $$code in 200|204|409) exit 0 ;; *) echo \"bucket create failed: HTTP $$code\" >&2; exit 1 ;; esac"]

  ollama:
    # Optional fully local model server (profile-gated; the dev
    # override in docker-compose.local.yml wires the api to it).
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  miniodata:
  ollamadata:
