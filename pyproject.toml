[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trida-blueprint-logistics-shipment-exception"
version = "0.1.0"
description = "Trida AI Blueprint — Logistics Shipment Exception Agent (reference prototype)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
# Direct dependencies are pinned EXACTLY (==). Loose >= ranges made pip's
# resolver backtrack for minutes on Python 3.10 (see constraints.txt header).
# The full transitive set is frozen in constraints.txt; install with:
#   pip install -e ".[dev]" -c constraints.txt
dependencies = [
    "langgraph==0.6.11",
    # The production system of record is PostgreSQL: the official
    # LangGraph Postgres checkpointer over psycopg 3 (see db.py /
    # store.py / checkpoints.py). DATABASE_URL configures it; without
    # one the service runs on in-memory test doubles.
    "langgraph-checkpoint-postgres==3.0.5",
    "psycopg[binary]==3.3.6",
    # Shipment documents live in object storage behind a port
    # (object_store.py): boto3 against any S3-compatible endpoint
    # (AWS S3, MinIO in the compose stack).
    "boto3==1.43.111",
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
    # Transitive via langchain-core -> langsmith (websockets>=15.0, unbounded).
    # websockets 17.x requires Python >=3.11, which sent the 3.10 resolver
    # into a backtracking cascade through langgraph/langchain/pydantic.
    # 16.0 is the newest line that supports Python 3.10. Pinned here so a
    # plain `pip install` (no -c constraints.txt) also resolves fast.
    "websockets==16.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
llm = ["openai==3.27.0", "anthropic==1.13.0"]
# Optional local vector store for RETRIEVER=semantic|hybrid (not part of
# the frozen default set in constraints.txt). The retriever only uses
# Chroma's stable surface (PersistentClient / collection add+query).
# Without it, semantic retrieval falls back to in-memory cosine.
vectordb = ["chromadb==1.5.9"]

[project.scripts]
shipment-agent = "shipment_agent.cli:main"
shipment-agent-demo = "shipment_agent.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shipment_agent = ["data/*.json", "static/*.html", "static/brand/*.png", "static/brand/*.svg", "static/brand/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
