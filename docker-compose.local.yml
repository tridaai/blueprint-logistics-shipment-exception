# Local development overrides — layer on top of the production-shaped
# base stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# Two jobs:
#  1. Publish the database and the S3 API (SeaweedFS gateway) on the
#     host, so local
#     tooling (psql, an S3 browser, the gated integration tests) can
#     reach them. The base file publishes neither — in the production
#     shape only the api is exposed. With db published, the Postgres
#     integration tests run against the stack:
#       DATABASE_URL=postgresql://logistics:logistics@localhost:5432/logistics \
#         uv run pytest tests/test_postgres_integration.py
#  2. A fully local model: with the `local-llm` profile the api is
#     re-pointed at a local Ollama server (same service, env only) —
#     records, checkpoints and vectors still live in Postgres/pgvector
#     and documents in the SeaweedFS S3 gateway; only the model
#     moves in-house.
#       docker compose -f docker-compose.yml -f docker-compose.local.yml \
#         --profile local-llm up --build
#     One-time model pulls (after the stack is up):
#       ... exec ollama ollama pull llama3.1
#       ... exec ollama ollama pull nomic-embed-text

services:
  db:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "8333:8333"

  api:
    environment:
      # Local model by default in this override; force the offline
      # mock with MODEL_BACKEND=mock in the shell if you only want
      # the published db/minio ports.
      MODEL_BACKEND: ${MODEL_BACKEND:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      RETRIEVER: hybrid
    depends_on:
      - ollama

  ollama:
    ports:
      - "11434:11434"
